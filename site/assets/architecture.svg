<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">How AthenaDB handles writes and reads</title>
  <desc id="d">Python and Rust clients call one core. Writes are validated, appended to a write-ahead log with fsync, then applied to the in-memory store. Reads run a parallel SIMD cosine search over the store and return the top k hits. Snapshots are written atomically and truncate the log. On boot, the last snapshot loads and the log tail replays.</desc>
  <style>
    .box { fill: #111620; stroke: #252d3d; }
    .title { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 12.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .write { stroke: #2dd4bf; }
    .read { stroke: #818cf8; }
    .flow { fill: none; stroke-width: 1.6; opacity: .55; }
    .maint { fill: none; stroke: #475569; stroke-width: 1.4; stroke-dasharray: 4 5; }
    .label { fill: #64748b; font-size: 11.5px; }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
  </style>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="960" height="456" rx="16" fill="#0b0e14" stroke="#1c2230"/>

  <!-- flows -->
  <path class="flow write" d="M224 96 C 270 96, 285 98, 330 98"/>
  <path class="flow write" d="M224 188 C 280 188, 280 110, 330 110"/>
  <path class="flow write" d="M430 140 L430 204"/>
  <path class="flow read" d="M224 96 C 275 96, 270 228, 330 240"/>
  <path class="flow read" d="M224 188 C 270 188, 285 256, 330 262"/>
  <path class="flow read" d="M596 259 L712 259"/>
  <path class="maint" d="M596 226 C 650 226, 650 120, 712 120"/>
  <path class="maint" d="M712 80 L596 80"/>
  <text class="label" x="620" y="72">truncate</text>
  <text class="label" x="614" y="164">every N ops,</text>
  <text class="label" x="614" y="179">or on demand</text>

  <!-- moving vectors -->
  <g class="dot" filter="url(#glow)">
    <circle r="4" fill="#2dd4bf" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="7s" repeatCount="indefinite"/>
      <animateMotion path="M224 96 C 270 96, 285 98, 330 98 L430 98 L430 204 L430 250" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#2dd4bf" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      <animateMotion path="M224 188 C 280 188, 280 110, 330 110 L430 110 L430 204 L430 250" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#818cf8" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      <animateMotion path="M224 96 C 275 96, 270 228, 330 240 L596 259 L712 259" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#818cf8" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.34;1" dur="5s" begin="3.7s" repeatCount="indefinite"/>
      <animateMotion path="M224 188 C 270 188, 285 256, 330 262 L596 259 L712 259" keyPoints="0;1;1" keyTimes="0;.34;1" calcMode="linear" dur="5s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- clients -->
  <g>
    <rect class="box" x="28" y="62" width="196" height="68" rx="11"/>
    <text class="title" x="46" y="90">Python</text>
    <text class="sub mono" x="46" y="112">import athenadb</text>
    <rect class="box" x="28" y="154" width="196" height="68" rx="11"/>
    <text class="title" x="46" y="182">Rust</text>
    <text class="sub mono" x="46" y="204">athenadb::db::Database</text>
    <rect x="28" y="246" width="196" height="68" rx="11" fill="none" stroke="#2a3344" stroke-dasharray="4 5"/>
    <text class="title" x="46" y="274" style="fill:#64748b">HTTP service</text>
    <text class="label" x="46" y="296">Axum scaffold, endpoints planned</text>
  </g>

  <!-- core -->
  <text class="label" x="330" y="46">WRITE-AHEAD LOG</text>
  <rect class="box" x="330" y="56" width="266" height="84" rx="11"/>
  <text class="title" x="348" y="86">Append, then fsync</text>
  <text class="sub" x="348" y="110">Before memory changes. Length-prefixed frames,</text>
  <text class="sub" x="348" y="127">so a torn tail is detected on replay.</text>

  <text class="label" x="330" y="194">VECTOR STORE</text>
  <rect class="box" x="330" y="204" width="266" height="110" rx="11"/>
  <text class="title" x="348" y="234">SIMD cosine, parallel top-k</text>
  <text class="sub mono" x="348" y="258">wide::f32x8 + rayon</text>
  <text class="sub" x="348" y="281">Filters by namespace and embedding</text>
  <text class="sub" x="348" y="298">model, so spaces never mix.</text>

  <!-- right -->
  <text class="label" x="712" y="46">SNAPSHOT</text>
  <rect class="box" x="712" y="56" width="220" height="84" rx="11"/>
  <text class="title" x="730" y="86">Atomic checkpoint</text>
  <text class="sub" x="730" y="110">Temp file, fsync, rename.</text>
  <text class="sub" x="730" y="127">Then the log is truncated.</text>

  <text class="label" x="712" y="194">RESULT</text>
  <rect class="box" x="712" y="204" width="220" height="110" rx="11"/>
  <text class="title" x="730" y="234">Top-k hits</text>
  <text class="sub mono" x="730" y="258">(id, score, namespace,</text>
  <text class="sub mono" x="730" y="276"> embed_model_id,</text>
  <text class="sub mono" x="730" y="294"> metadata_json)</text>

  <!-- key and recovery -->
  <line x1="1" x2="959" y1="346" y2="346" stroke="#1c2230"/>
  <circle cx="44" cy="376" r="4.5" fill="#2dd4bf"/>
  <text class="sub" x="56" y="381">Write path</text>
  <circle cx="44" cy="404" r="4.5" fill="#818cf8"/>
  <text class="sub" x="56" y="409">Read path</text>
  <line x1="33" x2="55" y1="432" y2="432" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text class="sub" x="62" y="436">Maintenance</text>
  <text class="title" x="330" y="378">After a crash</text>
  <text class="sub" x="330" y="402">Load the last snapshot, replay the log on top of it, and ignore a torn final frame:</text>
  <text class="sub" x="330" y="420">the signature of a process killed mid-write. Tested in <tspan class="mono">tests/persistence.rs</tspan>.</text>
</svg>
