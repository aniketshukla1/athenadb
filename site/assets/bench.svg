<circle cx="84.0" cy="284.3" r="5" fill="#0d9488" stroke="#0b0e14" stroke-width="2"/>
<circle cx="397.0" cy="219.8" r="5" fill="#0d9488" stroke="#0b0e14" stroke-width="2"/>
<circle cx="710.0" cy="150.5" r="5" fill="#0d9488" stroke="#0b0e14" stroke-width="2"/>
<text x="722.0" y="147.5" font-size="14" font-weight="600" fill="#e2e8f0">17 ms</text>
<text x="722.0" y="164.5" font-size="12" fill="#94a3b8">384 dimensions</text>
