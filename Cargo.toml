[package]
name = "athenadb"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Custom high-performance vector store: SIMD cosine search, WAL+snapshot durability, dual-mode (PyO3 + Axum)."

[lib]
name = "athenadb"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
server = ["dep:axum", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1.10"
wide = "0.7"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "athenadb"
path = "src/bin/athenadb.rs"
required-features = ["server"]

[[test]]
name = "http_api"
required-features = ["server"]

[profile.release]
lto = true
codegen-units = 1
# Cargo's default strip leaves the Python module unloadable on Darwin 27 ("mis-aligned LINKEDIT string pool").
strip = false
