[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "athenadb"
version = "0.2.0"
description = "High-performance custom vector database: SIMD cosine search, WAL + snapshot durability, dual-mode (native Python module + HTTP service)."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
# Build the PyO3 native module by default for the Python package.
features = ["python"]
module-name = "athenadb"

[tool.pytest.ini_options]
testpaths = ["tests"]
